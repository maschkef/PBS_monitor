services:
  webui:
    image: ghcr.io/maschkef/pbs_monitor-webui:latest
    build:
      context: .
      dockerfile: docker/webui/Dockerfile
    container_name: pbs-monitor-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-5111}:5111"
    env_file:
      - .env
    volumes:
      - alerting-data:/app/data
    depends_on:
      - alerting

  alerting:
    image: ghcr.io/maschkef/pbs_monitor-alerting:latest
    build:
      context: .
      dockerfile: docker/alerting/Dockerfile
    container_name: pbs-monitor-alerting
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - alerting-data:/app/data

volumes:
  alerting-data:
