name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Security: Minimal permissions
permissions:
  contents: read

jobs:
  lint-python:
    name: Python Syntax & Import Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install alerting dependencies
        run: pip install --no-cache-dir -r alerting/requirements.txt

      - name: Install webui dependencies
        run: pip install --no-cache-dir -r webui/requirements.txt

      - name: Syntax check — alerting
        run: python -m py_compile alerting/monitor.py

      - name: Syntax check — webui
        run: python -m py_compile webui/app.py

      - name: Install ruff
        run: pip install --no-cache-dir ruff

      - name: Lint — alerting
        run: ruff check alerting/

      - name: Lint — webui
        run: ruff check webui/

      - name: Lint — tests
        run: ruff check tests/

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install alerting dependencies
        run: pip install --no-cache-dir -r alerting/requirements.txt

      - name: Install webui dependencies
        run: pip install --no-cache-dir -r webui/requirements.txt

      - name: Install test dependencies
        run: pip install --no-cache-dir -r tests/requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build alerting image
        run: docker build -f docker/alerting/Dockerfile -t pbs-alerting-test .

      - name: Build webui image
        run: docker build -f docker/webui/Dockerfile -t pbs-webui-test .

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Build alerting image for scan
        run: docker build -f docker/alerting/Dockerfile -t pbs-alerting-test .

      - name: Build webui image for scan
        run: docker build -f docker/webui/Dockerfile -t pbs-webui-test .

      - name: Scan alerting image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pbs-alerting-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan webui image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pbs-webui-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  smoke-test:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - uses: actions/checkout@v7

      - name: Build webui image
        run: docker build -f docker/webui/Dockerfile -t pbs-webui-test .

      - name: Prepare bind-mount data directory
        run: mkdir -p /tmp/smoke-data

      - name: Start webui container
        run: |
          docker run -d \
            --name pbs-webui-smoke \
            -p 5111:5111 \
            -e API_KEY=smoke-test-key \
            -e WEBUI_PASSWORD=smoketestpw \
            -e WEBUI_SECRET_KEY=smoketestsecretkey1234567890abcdef12 \
            -e ALERTING_DATA_DIR=/app/data \
            -v /tmp/smoke-data:/app/data:rw \
            pbs-webui-test

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5111/login | grep -q "200"; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "Server did not become ready within 30s"
              docker logs pbs-webui-smoke
              exit 1
            fi
          done

      - name: Smoke – /login is publicly reachable (200)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5111/login)
          [ "$status" = "200" ] || { echo "Expected 200, got $status"; exit 1; }

      - name: Smoke – / redirects to /login when auth is enabled (302)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5111/)
          [ "$status" = "302" ] || { echo "Expected 302, got $status"; exit 1; }

      - name: Smoke – unauthenticated API request returns 401
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5111/api/webui/info)
          [ "$status" = "401" ] || { echo "Expected 401, got $status"; exit 1; }

      - name: Smoke – unauthenticated write route returns 401
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" -d '{}' \
            http://localhost:5111/api/alerting/config)
          [ "$status" = "401" ] || { echo "Expected 401, got $status"; exit 1; }

      - name: Smoke – process runs as non-root
        run: |
          uid=$(docker exec pbs-webui-smoke sh -c 'awk "/^Uid:/{print \$2}" /proc/1/status')
          [ "$uid" != "0" ] || { echo "Container process is running as root"; exit 1; }

      - name: Smoke – app source files are read-only for runtime user
        run: |
          result=$(docker exec --user pbs pbs-webui-smoke sh -c \
            'test -w /app/webui/app.py && echo writable || echo readonly')
          [ "$result" = "readonly" ] || { echo "app.py is writable by the runtime user"; exit 1; }

      - name: Smoke – data directory mode is 750
        run: |
          perm=$(docker exec pbs-webui-smoke stat -c '%a' /app/data)
          [ "$perm" = "750" ] || { echo "Expected data dir mode 750, got $perm"; exit 1; }

      - name: Smoke – runtime process umask is 0027
        run: |
          umask_val=$(docker exec pbs-webui-smoke \
            sh -c 'grep "^Umask:" /proc/1/status | cut -f2')
          [ "$umask_val" = "0027" ] || { echo "Expected umask 0027, got $umask_val"; exit 1; }

      - name: Dump container logs on failure
        if: failure()
        run: docker logs pbs-webui-smoke

      - name: Stop and remove container
        if: always()
        run: docker rm -f pbs-webui-smoke || true

  pbs-smoke-test:
    name: PBS End-to-End Smoke Test
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - uses: actions/checkout@v7

      - name: Build alerting image
        run: docker build -f docker/alerting/Dockerfile -t pbs-alerting-test .

      - name: Build pbs-test image
        run: docker build -f tests/e2e/pbs/Dockerfile.pbs -t pbs-test-server:ci tests/e2e/pbs

      - name: Create isolated docker network
        run: docker network create pbs-smoke-net

      - name: Start pbs-test container
        run: |
          docker run -d \
            --name pbs-test-server \
            --network pbs-smoke-net \
            --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            --tmpfs /var/lib/pbs-test-store \
            -p 8007:8007 \
            pbs-test-server:ci

      - name: Wait for PBS API to come up
        run: |
          for i in $(seq 1 90); do
            if docker exec pbs-test-server curl -fsSk \
                 https://localhost:8007/api2/json/version >/dev/null 2>&1; then
              echo "PBS API reachable after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = "90" ]; then
              echo "PBS API did not become ready within 90s"
              docker logs --tail=200 pbs-test-server
              exit 1
            fi
          done

      - name: Run setup-pbs.sh (creates datastore, token, renders config.json)
        run: |
          mkdir -p /tmp/pbs-smoke-data
          PBS_SMOKE_OUT=/tmp/pbs-smoke-data bash tests/e2e/pbs/setup-pbs.sh

      - name: Verify setup artefacts exist
        run: |
          test -s /tmp/pbs-smoke-data/.pbs-token \
            || { echo ".pbs-token missing or empty"; exit 1; }
          test -s /tmp/pbs-smoke-data/config.json \
            || { echo "config.json missing or empty"; exit 1; }
          grep -q '"type": "pbs"' /tmp/pbs-smoke-data/config.json \
            || { echo "config.json missing pbs source"; exit 1; }

      - name: Run alerting monitor one-shot against PBS
        run: |
          set +e
          docker run --rm \
            --name pbs-alerting-smoke \
            --network pbs-smoke-net \
            --env-file /tmp/pbs-smoke-data/.pbs-token \
            -e API_KEY=smoke-test-key \
            -e ALERTING_DATA_DIR=/app/data \
            -v /tmp/pbs-smoke-data:/app/data:rw \
            pbs-alerting-test \
            python -m alerting.monitor \
            > /tmp/pbs-smoke.log 2>&1
          exit_code=$?
          set -e
          echo "---- monitor output ----"
          cat /tmp/pbs-smoke.log
          echo "---- /monitor output ----"
          [ "$exit_code" = "0" ] \
            || { echo "monitor exited $exit_code"; exit 1; }
          grep -q "\[home\]" /tmp/pbs-smoke.log \
            || { echo "expected source_id 'home' in monitor output"; exit 1; }
          # A traceback indicates an unhandled failure in the pbs code path.
          # Per-source errors go through structured logging (no "Traceback" line).
          if grep -q "^Traceback" /tmp/pbs-smoke.log; then
            echo "monitor emitted a traceback"
            exit 1
          fi

      - name: Dump pbs-test logs on failure
        if: failure()
        run: docker logs --tail=200 pbs-test-server || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f pbs-test-server || true
          docker network rm pbs-smoke-net || true
