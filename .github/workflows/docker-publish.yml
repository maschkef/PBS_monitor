name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_ALERTING: ${{ github.repository }}-alerting
  IMAGE_NAME_WEBUI: ${{ github.repository }}-webui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for alerting image
      id: meta-alerting
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ALERTING }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc') }}
          type=raw,value=edge,enable=${{ github.ref_type == 'tag' }}

    - name: Extract metadata for webui image  
      id: meta-webui
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBUI }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc') }}
          type=raw,value=edge,enable=${{ github.ref_type == 'tag' }}

    - name: Build and push alerting image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/alerting/Dockerfile
        push: true
        tags: ${{ steps.meta-alerting.outputs.tags }}
        labels: ${{ steps.meta-alerting.outputs.labels }}

    - name: Build and push webui image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/webui/Dockerfile
        push: true
        tags: ${{ steps.meta-webui.outputs.tags }}
        labels: ${{ steps.meta-webui.outputs.labels }}

    # Create release assets for tagged releases
    - name: Prepare release assets
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release-assets
        
        # Lowercase repo name for GHCR (GHCR requires lowercase image names)
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        
        # Create standalone docker-compose.yml using registry images
        cat > release-assets/docker-compose.yml << EOF
        services:
          pbs-alerting:
            image: ghcr.io/${REPO_LOWER}-alerting:\${VERSION:-latest}
            container_name: pbs-alerting
            restart: unless-stopped
            volumes:
              - ./config:/app/data:rw
              - ./.env:/app/.env:ro
            environment:
              - PYTHONUNBUFFERED=1
              - ALERTING_DATA_DIR=/app/data
            deploy:
              resources:
                limits:
                  memory: 256M
                reservations:
                  memory: 128M

          pbs-webui:
            image: ghcr.io/${REPO_LOWER}-webui:\${VERSION:-latest}
            container_name: pbs-webui
            restart: unless-stopped
            ports:
              - "5111:5111"
            volumes:
              - ./config:/app/data:rw
              - ./.env:/app/.env:ro
            environment:
              - PYTHONUNBUFFERED=1
              - ALERTING_DATA_DIR=/app/data
              - WEBUI_HOST=0.0.0.0
              - WEBUI_PORT=5111
              - WEBUI_READ_ONLY=0
              - FLASK_DEBUG=0
            deploy:
              resources:
                limits:
                  memory: 512M
                reservations:
                  memory: 256M

        networks:
          default:
            name: pbs-monitor
        EOF
        
        # Copy environment template
        cp .env.example release-assets/.env.example
        
        # Create quickstart script
        cp docker/quick-deploy.sh release-assets/quickstart.sh
        chmod +x release-assets/quickstart.sh
        
        # Create README for Docker deployment
        TAG="${{ github.ref_name }}"
        cat > release-assets/README-DOCKER.md << EOF
        # PBS Monitor — Docker Deployment

        Two independent tools that share a common data directory:

        - **Web UI** — Dashboard for ad-hoc status checks (port 5111)
        - **Alerting** — Automated monitoring with push notifications via ntfy

        ## Quick Start

        ### Option 1: One-command deployment
        \`\`\`bash
        bash quickstart.sh
        \`\`\`

        ### Option 2: Manual setup
        \`\`\`bash
        cp .env.example .env
        nano .env          # Set API_KEY (required), optionally WEBUI_PASSWORD
        docker compose up -d
        \`\`\`

        Open the dashboard: http://localhost:5111

        ## Docker Images

        This release (${TAG}) provides the following tags:

        | Tag | Description |
        |-----|-------------|
        | \`${TAG}\` | Exact version, pinned |
        | \`${TAG%.*}\` | Minor-version float (e.g. \`1.0\`) |
        | \`latest\` | Latest stable release |
        | \`edge\` | Latest tagged release (may be pre-release) |

        Images:
        \`\`\`
        ghcr.io/${REPO_LOWER}-alerting:${TAG}
        ghcr.io/${REPO_LOWER}-webui:${TAG}
        \`\`\`

        ## Files in this release

        | File | Description |
        |------|-------------|
        | \`docker-compose.yml\` | Ready-to-use multi-service setup |
        | \`.env.example\` | Configuration template — copy to \`.env\` and fill in |
        | \`quickstart.sh\` | Automated deployment script |

        ## Key environment variables

        | Variable | Default | Description |
        |----------|---------|-------------|
        | \`API_KEY\` | — | **Required.** Monitoring API token from remote-backups.com |
        | \`WEBUI_PASSWORD\` | *(empty)* | Set to protect the dashboard with a password |
        | \`WEBUI_SECRET_KEY\` | *(auto)* | Flask session key — set for stable sessions across restarts |
        | \`WEBUI_PORT\` | \`5111\` | Host port for the Web UI |
        | \`NTFY_TOKEN\` | *(empty)* | ntfy bearer token (preferred over storing it in config.json) |

        For the full list see the project README or the Web UI settings (⚙️).

        ## Updating

        \`\`\`bash
        docker compose pull
        docker compose up -d
        \`\`\`

        ## Data persistence

        Both services mount \`./config\` to \`/app/data\`. Back up this directory to
        preserve alerting configuration, learned schedules, and notification history.
        EOF

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: docker-assets
        path: release-assets/

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract tag annotation
      id: tag_meta
      run: |
        SUBJECT=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}")
        BODY=$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}")
        echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
        {
          echo "body<<EOF"
          echo "$BODY"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Download release assets
      uses: actions/download-artifact@v8
      with:
        name: docker-assets
        path: release-assets/

    - name: Compute lowercase image names
      id: repo
      run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-assets/docker-compose.yml
          release-assets/.env.example
          release-assets/quickstart.sh
          release-assets/README-DOCKER.md
        generate_release_notes: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        body: |
          ${{ steps.tag_meta.outputs.body }}

          ---

          ## 🐳 Docker Support

          This release includes Docker support for easy deployment.

          ### Quick Start Options

          **Option 1: One-command deployment**
          ```bash
          curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/docker/quick-deploy.sh | bash
          ```

          **Option 2: Traditional docker-compose workflow**
          ```bash
          wget https://github.com/${{ github.repository }}/releases/latest/download/docker-compose.yml
          wget https://raw.githubusercontent.com/${{ github.repository }}/main/.env.example -O .env
          # Edit .env and set API_KEY, then:
          docker-compose up -d
          ```

          ### Docker Images

          | Tag | Description |
          |-----|-------------|
          | `:${{ github.ref_name }}` | This exact version |
          | `:latest` | Latest stable release (updated on each non-pre-release tag) |
          | `:edge` | Latest tagged release (may be a pre-release) |

          ```
          ghcr.io/${{ steps.repo.outputs.lower }}-alerting:${{ github.ref_name }}
          ghcr.io/${{ steps.repo.outputs.lower }}-webui:${{ github.ref_name }}
          ```

          See the attached `README-DOCKER.md` for full setup instructions and all available tags.

    - name: Create deployment summary
      run: |
        REPO_LOWER="${{ steps.repo.outputs.lower }}"
        echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Alerting Service" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "ghcr.io/${REPO_LOWER}-alerting:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Web UI Service" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "ghcr.io/${REPO_LOWER}-webui:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Quick Start" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "# Option 1: Quickstart" >> $GITHUB_STEP_SUMMARY
        echo "wget -qO quick-deploy.sh https://raw.githubusercontent.com/${{ github.repository }}/main/docker/quick-deploy.sh && bash quick-deploy.sh" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Option 2: Traditional docker-compose workflow" >> $GITHUB_STEP_SUMMARY
        echo "wget https://github.com/${{ github.repository }}/releases/latest/download/docker-compose.yml" >> $GITHUB_STEP_SUMMARY
        echo "wget https://raw.githubusercontent.com/${{ github.repository }}/main/.env.example -O .env" >> $GITHUB_STEP_SUMMARY
        echo "# Edit .env and set API_KEY, then:" >> $GITHUB_STEP_SUMMARY
        echo "docker-compose up -d" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY